[General]
MOD=Mod4                ; Keycaps for I3 (Mod4 = Win, Mod1 = Alt)
EPICONF_ASCII=enable    ; Write EPICONF in the top of shell
INACTIVITY_TIME=60      ; Time before auto i3lock (in second)
START_AT_AFS=disable    ; New terminal are opened at ~/afs
NVIM=enable             ; Alias vim to nvim

[Wallpaper]
WALLPAPER_TIME=300      ; Time before change wallpaper (in second)

[Game]
GAMES=disable           ; Activate games commands (lunar, osu)

[Music]
MUSIC_LOADER=enable     ; Install Spotify and Deezer
MUSIC=spotify           ; Main music app (spotify, deezer)

[Polybar]
POLYBAR_NAME=example    ; Choose polybar (example, float)

; You can choose which module go on left, right or center
[Polybar_left]
xworkspaces=enable      ; Show active and used workspaces

[Polybar_right]
afssize=enable          ; Show the afs size
memory=enable           ; Show the RAM utilisation
cpu=enable              ; Show the CPU utilisation
date=enable             ; Show the date and hour

[Vim]
MOUSE=disable           ; Mouse on vim
INSERT_AT_START=disable ; Insert mode at start
CLOSE_BRACKET=enable    ; Close (, [, ', ", {
SNIPPETS=enable	        ; Activate snippets with @
VSCODE=disable          ; Activate Ctrl + z and Ctrl + u

[Keyboard]
START_KB=us             ; Start layer keyboard
CAPS_TO=caps            ; Remap capslock to another key

[Visual]
INNER=7                 ; The gaps inner of windows
FADING=true             ; The fading (true or false)
