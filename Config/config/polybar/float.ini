[bar/float]
inherit = bar/default

width = 98%
height = 27
offset-x = 1%
offset-y = 1%
fixed-center = true

background = #cc222222
foreground = #ffffffff
afssize = ${colors.yellow}

primary = #00ffffff

line-size = 3
line-color = #ff5555

border-size = 2
border-color = #00000055

padding-left = 4
padding-right = 4

module-margin-left = 2
module-margin-right = 2

font-0 = JetBrainsMono Nerd Font:pixelsize=11;2
font-1 = unifont:fontformat=truetype:size=8:antialias=false;0

override-redirect = true
